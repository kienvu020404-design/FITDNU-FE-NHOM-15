<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Quản trị hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-light"> <header class="bg-danger text-white border-bottom shadow-sm">
        <div style="background-color: rgba(0, 0, 0, 0.15);">
            <div class="container py-1 text-end small">
                Xin chào, <strong>Admin</strong> | <a href="#" class="text-white text-decoration-none">Đăng xuất</a>
            </div>
        </div>

        <div class="container py-2">
            <div class="row align-items-center">
                <div class="col-md-6 col-12 mb-2 mb-md-0">
                    <h2 class="m-0 fw-bold"><img src="./img/logoshop.jpg" alt="Shop Logo" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 5px;"> ShopEasy <span class="fs-5 text-warning">| Quản trị</span></h2>
                </div>
                <div class="col-md-6 col-12 text-md-end text-center">
                    <a href="index.html" class="btn btn-outline-light"><i class="fa-solid fa-house"></i> Về trang chủ</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container mt-4 mb-5">
        <div class="row g-4">
            
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white border-bottom-0 pt-3 pb-0">
                        <h5 class="fw-bold text-danger"><i class="fa-solid fa-plus-circle"></i> Thêm sản phẩm mới</h5>
                    </div>
                    <div class="card-body">
                        <form id="productForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Loại sản phẩm</label>
                                <select class="form-select" id="inputType">
                                    <option value="phone">Điện thoại</option>
                                    <option value="laptop">Laptop</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Tên sản phẩm</label>
                                <input type="text" class="form-control" id="inputName" placeholder="VD: iPhone 15 Pro Max">
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label fw-bold small">Giá bán mới (Số)</label>
                                    <input type="number" class="form-control" id="inputPrice" placeholder="29500000">
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label fw-bold small">Giá cũ (Chữ)</label>
                                    <input type="text" class="form-control" id="inputOldPrice" placeholder="34.990.000đ">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-8 mb-3">
                                    <label class="form-label fw-bold small">Link hình ảnh</label>
                                    <input type="text" class="form-control" id="inputImage" placeholder="https://...">
                                </div>
                                <div class="col-4 mb-3">
                                    <label class="form-label fw-bold small">Nhãn</label>
                                    <input type="text" class="form-control" id="inputBadge" placeholder="Mới/Giảm 10%">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold small">Mô tả ngắn</label>
                                <textarea class="form-control" id="inputDesc" rows="2" placeholder="Nhập mô tả sản phẩm..."></textarea>
                            </div>
                            <button type="button" class="btn btn-danger w-100 fw-bold rounded-3" id="btnSave">
                                <i class="fa-solid fa-floppy-disk"></i> Lưu sản phẩm
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-3 h-100">
                    <div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold text-dark m-0"><i class="fa-solid fa-list"></i> Danh sách quản lý</h5>
                        <button class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-rotate-right"></i> Làm mới</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col">ID</th>
                                        <th scope="col">Hình ảnh</th>
                                        <th scope="col">Tên sản phẩm</th>
                                        <th scope="col">Loại</th>
                                        <th scope="col">Giá bán</th>
                                        <th scope="col" class="text-end">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="adminTableBody">
                                    <tr>
                                        <td class="fw-bold text-muted">1</td>
                                        <td>
                                            <img src="https://via.placeholder.com/50" class="rounded border" style="width: 50px; height: 50px; object-fit: contain;">
                                        </td>
                                        <td class="fw-bold">Xiaomi REDMI K90 Pro Max</td>
                                        <td><span class="badge bg-secondary">phone</span></td>
                                        <td class="text-danger fw-bold">14.950.000đ</td>
                                        <td class="text-end">
                                            <button class="btn btn-warning btn-sm text-dark me-1" title="Sửa"><i class="fa-solid fa-pen-to-square"></i></button>
                                            <button class="btn btn-danger btn-sm" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="fw-bold text-muted">101</td>
                                        <td><img src="https://via.placeholder.com/50" class="rounded border" style="width: 50px; height: 50px; object-fit: contain;"></td>
                                        <td class="fw-bold">MSI Katana 15 (2416VN)</td>
                                        <td><span class="badge bg-dark">laptop</span></td>
                                        <td class="text-danger fw-bold">22.500.000đ</td>
                                        <td class="text-end">
                                            <button class="btn btn-warning btn-sm text-dark me-1"><i class="fa-solid fa-pen-to-square"></i></button>
                                            <button class="btn btn-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/admin.js"></script> 
</body>
</html>
