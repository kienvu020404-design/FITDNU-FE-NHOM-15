<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        #productDetailContent {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #productDetailContent.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .detail-image,
        .detail-info {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #productDetailContent.visible .detail-image {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.1s;
        }
        #productDetailContent.visible .detail-info {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.2s;
        }
        #detailImage {
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #productDetailContent.visible #detailImage {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <header class="bg-danger text-white py-3 mb-4">
        <div class="container">
            <a href="index.html" class="text-white text-decoration-none fw-bold">← Quay lại trang chủ</a>
        </div>
    </header>

    <div class="container">
        <div class="row" id="productDetailContent">
            <div class="col-md-5 text-center border rounded p-3 detail-image">
                <img id="detailImage" src="" class="img-fluid" alt="Ảnh sản phẩm">
            </div>
            <div class="col-md-7 mt-3 mt-md-0 detail-info">
                <h2 id="detailName" class="fw-bold">Đang tải tên sản phẩm...</h2>
                <div class="d-flex align-items-baseline mb-3">
                    <span id="detailPrice" class="text-danger fw-bold fs-2 me-3"></span>
                    <span id="detailOldPrice" class="text-muted text-decoration-line-through"></span>
                </div>
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Mô tả sản phẩm</h5>
                        <p id="detailDesc" class="card-text"></p>
                    </div>
                </div>
                <button class="btn btn-danger btn-lg w-100">Thêm vào giỏ hàng</button>
            </div>
        </div>
    </div>

    <script src="./js/utils.js"></script>
    <script src="./js/detail.js"></script>
</body>
</html>
